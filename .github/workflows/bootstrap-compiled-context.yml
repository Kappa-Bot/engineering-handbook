name: bootstrap-compiled-context

on:
  push:
    branches:
      - docs/handbook-compiler-agent-context-design
    paths:
      - .github/workflows/bootstrap-compiled-context.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact repository snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            | tar -xz --strip-components=1
      - name: Compile handbook context
        run: python -m automation.engineering_context.handbook_compile . /tmp/compiled
      - name: Write missing compiled artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: docs/handbook-compiler-agent-context-design
        run: |
          for file in planning.json implementation.json verification.json; do
            content=$(base64 -w0 "/tmp/compiled/${file}")
            payload=$(python - "$file" "$content" "$BRANCH" <<'PY'
          import json, sys
          file, content, branch = sys.argv[1:]
          print(json.dumps({"message": f"build: add compiled {file}", "content": content, "branch": branch}))
          PY
          )
            curl --fail --request PUT \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/machine-readable/compiled/${file}"
          done
