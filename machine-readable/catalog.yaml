  - id: adr-0002-codex-global-distribution
    kind: decision
    path: decisions/0002-codex-global-distribution.md
    status: accepted
    applies_to: [engineering-handbook, codex]

  - id: registry-catalog
    kind: registry
    path: machine-readable/catalog.yaml
