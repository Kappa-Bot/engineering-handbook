  - id: gov-source-authority
    kind: governance
    path: governance/source-authority.md
    status: active
    applies_to: [engineering-handbook]

  - id: gov-knowledge-promotion
    kind: governance
    path: governance/knowledge-promotion.md
    status: active
    applies_to: [engineering-handbook, all-repositories]

  - id: gov-document-lifecycle
    kind: governance
    path: governance/document-lifecycle.md
    status: active
    applies_to: [engineering-handbook]

